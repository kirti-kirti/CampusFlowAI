# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=campusflow-ai

# ─── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/campusflow_db
spring.datasource.username=root
spring.datasource.password=campusflow123

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── HikariCP Connection Pool ─────────────────────────────────────────────────────
# Keep connections alive and handle Mac sleep/wake clock jumps gracefully
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JWT ───────────────────────────────────────────────────────────────────────
# Secret must be at least 256 bits (32 chars) for HS256
jwt.secret=campusflow-ai-super-secret-key-must-be-at-least-256-bits-long
# Token validity: 24 hours in milliseconds
jwt.expiration=86400000

# ─── Firebase ──────────────────────────────────────────────────────────────────
# Path to your Firebase service account JSON file (download from Firebase Console)
# Firebase Console → Project Settings → Service Accounts → Generate new private key
firebase.config.path=classpath:firebase-service-account.json

# ─── SpringDoc / Swagger UI ─────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ─── Mail (Password Recovery) ─────────────────────────────────────────────────────
# Replace with your real SMTP credentials to send actual emails.
# For testing without a mail server, the token is logged to console.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Disable mail auto-config failure if credentials are not set
spring.mail.test-connection=false
