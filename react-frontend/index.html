    <script>
      // Load Google Maps only when API key is present
      (function() {
        var key = '__VITE_GMAPS__';
        if (key && key !== '__VITE_GMAPS__') {
          var s = document.createElement('script');
          s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key + '&libraries=geometry,marker&loading=async';
          s.async = true;
          document.head.appendChild(s);
        }
      })();
    </script>
